<!doctype html>
<html lang="zh-Hant">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="adapter.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>賽博靈骨塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<style>
/* Layout: pale morning-water ground; a white pill bar on top, a thin-type catchline over a glowing ghost word, then every friend floats in a soap bubble. */
:root{
  --bg:#EFF3FA; --bg2:#E2EAF7; --surface:#FFFFFF; --ink:#2A3350; --muted:#7D89A7; --hint:#8E929B;
  --water:#6B9CDE; --water-deep:#4A78C2; --glow:rgba(107,182,222,.42);
  --ember:#E25B2E; --ember-soft:#FBE6DE; --seal:#D8362A;
  --line:rgba(42,51,80,.1); --gold:#B6924A; --haze:rgba(239,243,250,.9);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
}
/* Light-only by design: the bubbles read best on the pale ground. */
:root{color-scheme:light}
html{overflow-x:hidden}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;font-weight:400;
  background-image:radial-gradient(90% 50% at 50% 0%,var(--bg2),transparent 70%);min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.drop-card:focus-visible{outline:2px solid var(--water);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px;position:relative;z-index:1}

/* soap bubble (photo fades inside a wobbling rim) */
.bubble{--s:190px;width:var(--s);max-width:100%;aspect-ratio:1;position:relative;flex:none;
  animation:squish 16s ease-in-out infinite}
.bubble .photo{position:absolute;inset:8%;border-radius:50%;overflow:hidden;
  -webkit-mask-image:radial-gradient(closest-side,#000 52%,rgba(0,0,0,.55) 78%,transparent 100%);
          mask-image:radial-gradient(closest-side,#000 52%,rgba(0,0,0,.55) 78%,transparent 100%)}
.bubble .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88) brightness(1.03)}
.bubble .photo::after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,transparent 42%,var(--haze) 100%)}
.bubble .rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
@keyframes squish{0%,100%{scale:1}20%{scale:1.01 .98}40%{scale:.995 1.05}60%{scale:1.05 .99}80%{scale:.98 1.025}}
/* each floater wanders along its own four-point loop (vars set per element) */
@keyframes wander{0%,100%{translate:0 0}25%{translate:var(--x1) var(--y1)}50%{translate:var(--x2) var(--y2)}75%{translate:var(--x3) var(--y3)}}

#bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bubbles .bubble{position:absolute;opacity:.9;animation:squish 16s ease-in-out infinite,wander var(--wd,40s) ease-in-out infinite}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;margin-bottom:12px}
.mark{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.08em;color:var(--seal);line-height:1;white-space:nowrap}
.mark small{display:block;font-family:var(--f-num);font-weight:500;font-size:10px;letter-spacing:.32em;color:var(--muted);margin-top:6px}
.pillbar{position:relative;display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap;background:var(--surface);border-radius:999px;padding:6px 6px 6px 26px;box-shadow:0 10px 30px -18px rgba(42,51,80,.35)}
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:6px;color:var(--water);font-size:13px;letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-weight:500;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.ember b{color:var(--ember)}

/* hero */
.hero{position:relative;padding-block:44px 36px;isolation:isolate}
.ghost-text{position:absolute;inset:0;z-index:-1;display:flex;flex-direction:column;justify-content:center;font-family:var(--f-num);font-weight:300;
  font-size:clamp(48px,9vw,112px);line-height:1.1;color:var(--bg);text-shadow:0 0 56px var(--glow);white-space:nowrap;pointer-events:none;user-select:none}
.ghost-text span:nth-child(2){padding-left:min(38vw,460px)}
.catch{font-family:var(--f-display);font-weight:300;color:var(--water);font-size:clamp(22px,5vw,48px);line-height:1.55;letter-spacing:.18em;margin:0;white-space:nowrap}
.catch-en{font-family:var(--f-num);font-weight:500;letter-spacing:.06em;font-size:18px;margin:18px 0 0}
.catch-en span{color:var(--water)}
.btn{border:0;border-radius:999px;padding:11px 22px;background:linear-gradient(135deg,var(--water),color-mix(in srgb,var(--water) 60%,#9FD3F0));color:#fff;font-weight:500;letter-spacing:.08em;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ember{background:var(--ember);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px}

.notice{border:1px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);margin-bottom:20px;font-size:14px}
.visitors-banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:24px}
.visitors-banner .lead{font-family:var(--f-display);font-size:17px}
.visitors-banner .lead em{font-style:normal;color:var(--ember)}

/* grid of droplets */
.pond{position:relative;width:100%;min-height:320px;margin-top:56px}
/* owner's sticky note, IG-notes style: a thought bubble resting on the top edge of the soap bubble */
.note{position:absolute;left:50%;top:0;transform:translate(-50%,-62%);z-index:3;width:max-content;max-width:min(190px,92%);
  background:#fff;color:var(--ink);border-radius:18px;padding:8px 13px;font-size:13px;line-height:1.45;font-weight:500;
  box-shadow:0 10px 24px -12px rgba(42,51,80,.4);overflow-wrap:anywhere;text-align:center;animation:note-in .4s ease-out both}
.note::before,.note::after{content:"";position:absolute;border-radius:50%;background:#fff;box-shadow:0 4px 10px -6px rgba(42,51,80,.4)}
.note::before{width:11px;height:11px;bottom:-7px;left:30%}
.note::after{width:6px;height:6px;bottom:-15px;left:24%}
@keyframes note-in{from{opacity:0;transform:translate(-50%,-40%) scale(.9)}}
.head-bubble{position:relative;padding-top:10px}
.head-bubble .note{max-width:200px}
.notes{display:grid;gap:8px}
.note-row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;border-radius:16px;background:var(--bg)}
.note-row .t{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.note-row .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.live{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--water);color:#fff}
.note-compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--bg);color:var(--ink);font:inherit}
.drop-card{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-radius:24px}
.pond .drop-card{position:absolute;left:0;top:0;animation:wander var(--wd,24s) ease-in-out infinite;animation-delay:var(--wdl,0s)}
.pond .drop-card.has-note{z-index:1}
.pond .drop-card:hover,.pond .drop-card:focus-visible{animation-play-state:paused;z-index:2}
.drop-card:hover .bubble{animation-duration:6s}
.drop-name{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.12em;line-height:1.3;max-width:100%;overflow-wrap:anywhere}
.drop-meta{font-family:var(--f-num);font-size:12px;color:var(--muted);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;letter-spacing:.04em}
.drop-meta .in{color:var(--ember)}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;padding:2px 10px;border-radius:999px;background:var(--water);color:#fff;font-family:var(--f-body)}

.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 16px 40px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);font-weight:400;letter-spacing:.16em;color:var(--water);margin:0;font-size:24px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 55%,rgba(0,0,0,.45));backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:26px;width:100%;max-width:760px;padding:26px clamp(16px,4vw,34px) 32px;position:relative;box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted)}
.x:hover{background:var(--line)}
.altar-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.altar-head .bubble{--s:190px}
.altar-head h2{font-family:var(--f-display);font-weight:500;letter-spacing:.14em;font-size:clamp(28px,5vw,38px);margin:0;line-height:1.25;overflow-wrap:anywhere}
.epitaph{font-family:var(--f-display);font-weight:300;color:var(--water);letter-spacing:.1em;font-size:17px;margin:6px 0 10px;overflow-wrap:anywhere}
.claim-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted)}
@media (max-width:520px){.altar-head{grid-template-columns:1fr;justify-items:center;text-align:center}.claim-row{justify-content:center}}

.rituals{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:26px 0 8px}
@media (max-width:520px){.rituals{grid-template-columns:1fr}}
.ritual{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;overflow:hidden;min-width:0}
.ritual h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:400;letter-spacing:.1em}
.ritual .count{font-family:var(--f-num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ritual .count b{font-size:20px;color:var(--ink)}
.burner{width:170px;height:150px}
.burner .stick{transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.burner .tip{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.smoke{position:absolute;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--muted) 45%,transparent);filter:blur(4px);pointer-events:none;animation:smoke 3.2s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),-90px) scale(4)}}
.fish{width:190px;height:162px;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.fish svg{width:100%;height:100%;overflow:visible}
.fish .fish-body{transform-origin:92px 144px}
.fish .mallet{transform-origin:190px 12px}
.fish:hover .mallet{transform:rotate(-4deg)}
/* merit effects */
.fish-ritual{overflow:visible}
.fish-wrap{position:relative;display:grid;place-items:center}
.halo{--heat:0;position:absolute;left:50%;top:52%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;
  opacity:var(--heat);transform:scale(calc(.75 + var(--heat)*.45));
  background:radial-gradient(circle,rgba(255,226,140,.95) 0%,rgba(255,196,84,.5) 30%,rgba(255,196,84,0) 66%)}
.halo::before{content:"";position:absolute;inset:-10%;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,210,110,.55) 0deg 4deg,rgba(255,210,110,0) 4deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.fish{position:relative;z-index:1}
.fish.hit .fish-body{animation:thump .22s cubic-bezier(.3,.7,.4,1)}
.fish.hit .mallet{animation:mallet .22s cubic-bezier(.5,0,.5,1)}
@keyframes thump{0%{transform:scale(1)}30%{transform:scale(1.025,.955)}60%{transform:scale(.99,1.012)}100%{transform:scale(1)}}
@keyframes mallet{0%{transform:rotate(0)}38%{transform:rotate(-26deg)}52%{transform:rotate(-23deg)}100%{transform:rotate(0)}}
.count b.pop{display:inline-block;animation:pop .25s ease-out}
@keyframes pop{40%{transform:scale(1.35);color:var(--gold)}}
.combo{--tier:0;position:absolute;top:12px;right:14px;font-family:var(--f-num);font-weight:700;font-style:italic;font-size:calc(15px + var(--tier)*12px);
  color:transparent;background:linear-gradient(180deg,#FFE7A0,#E59A1E);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 6px rgba(229,154,30,.45));opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
.combo.on{opacity:1}
.combo.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.3) rotate(-4deg)}}
#fx-layer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#fx-canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-text{position:absolute;transform:translate(-50%,0) rotate(var(--rot,0deg));font-family:var(--f-display);font-weight:700;white-space:nowrap;
  color:transparent;background:linear-gradient(180deg,#FFF3C4 0%,#F5C04A 45%,#C9851C 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 3px rgba(150,90,10,.45)) drop-shadow(0 0 10px rgba(255,200,90,.6));animation:rise-text 1.25s cubic-bezier(.2,.7,.3,1) forwards}
.fx-text.bonus{background-image:linear-gradient(180deg,#FFE0EC,#F48FB1 55%,#C2185B)}
@keyframes rise-text{0%{opacity:0;transform:translate(-50%,10px) rotate(var(--rot)) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) rotate(var(--rot)) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-110px) rotate(var(--rot)) scale(1)}}
.fx-ring{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,206,100,.9);
  box-shadow:0 0 18px rgba(255,200,90,.7),inset 0 0 12px rgba(255,220,140,.6);animation:ring .65s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}
.fx-banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;text-align:center;animation:banner 2.3s ease-out forwards}
.fx-banner b{position:relative;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,9vw,76px);letter-spacing:.2em;white-space:nowrap;
  color:transparent;background:linear-gradient(180deg,#FFF6D2 0%,#FFD566 40%,#E39A22 70%,#FFE9A8 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 4px 6px rgba(140,80,0,.45)) drop-shadow(0 0 26px rgba(255,200,80,.9))}
.fx-banner span{position:relative;font-size:16px;letter-spacing:.2em;color:#7A4A00;font-weight:700;padding:4px 14px;border-radius:999px;background:rgba(255,248,225,.85);box-shadow:0 0 18px rgba(255,200,90,.7)}
.fx-banner .rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,215,110,.55) 0deg 5deg,rgba(255,215,110,0) 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 68%);mask:radial-gradient(circle,#000 10%,transparent 68%);animation:spin 6s linear infinite}
.fx-banner.big .rays{width:760px;height:760px;margin:-380px 0 0 -380px}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1.04)}}
/* incense */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
.burner-wrap{--lv:0;position:relative;display:grid;place-items:center}
.burner-box{position:relative;width:170px;height:150px}
.burner.jolt{animation:jolt .28s ease-out}
@keyframes jolt{30%{transform:translateY(2px) scale(1.01,.99)}60%{transform:translateY(-1px)}}
.stick-new{animation:plunge .45s cubic-bezier(.55,0,.8,.3) both}
@keyframes plunge{0%{transform:translateY(-70px);opacity:0}25%{opacity:1}82%{transform:translateY(3px)}100%{transform:translateY(0)}}
.burner .tip{animation:glow 1.6s ease-in-out infinite alternate}
.burner .tip-new{animation:ignite .9s ease-out both,glow 1.6s 1s ease-in-out infinite alternate}
@keyframes ignite{0%,55%{r:0;opacity:0}70%{r:5;opacity:1;fill:#FFE08A}100%{r:2.2;fill:#FF6A1A}}
.ash-glint{animation:glint 1.8s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0}50%{opacity:1}}
.wisps{position:absolute;inset:0;pointer-events:none}
.wisps span{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(150,150,160,.35);filter:blur(3px);animation:wisp var(--d) ease-out infinite;animation-delay:var(--dl)}
@keyframes wisp{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.8}60%{transform:translate(var(--sw),-46px) scale(2.2)}100%{opacity:0;transform:translate(calc(var(--sw)*-.6),-90px) scale(3.6)}}
.ash-meter{width:min(200px,80%);height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ash-meter span{display:block;height:100%;background:linear-gradient(90deg,#C9C3BA,#9C958B);transition:width .6s}
.ash-meter.full span{background:linear-gradient(90deg,#E7B341,#FBE3A0,#E7B341);animation:shimmer 1.6s linear infinite;background-size:200% 100%}
@keyframes shimmer{to{background-position:-200% 0}}
.ash-status{font-size:12px;color:var(--muted);text-align:center;max-width:240px}
.ash-btn.ready{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 0 rgba(231,179,65,.6);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(231,179,65,.55)}100%{box-shadow:0 0 0 12px rgba(231,179,65,0)}}
.aura{position:absolute;left:50%;top:58%;width:250px;height:210px;margin:-105px 0 0 -125px;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,rgba(255,150,60,.6),rgba(255,120,40,.18) 45%,rgba(255,120,40,0) 68%);opacity:calc(var(--lv)*.24);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);filter:brightness(1.15)}}
.embers{position:absolute;inset:0;pointer-events:none}
.embers span{position:absolute;left:var(--x);top:20%;width:3px;height:3px;border-radius:50%;background:#FFC266;box-shadow:0 0 6px 1px #FF7A1A;animation:emb var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes emb{0%{opacity:0;transform:translate(0,20px)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-90px)}}
.burner{position:relative}
.tier-badge{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.12em;padding:2px 10px;border-radius:999px;background:var(--ember-soft);color:var(--ember);font-weight:700;z-index:2}
.incense-ritual.tier-2{box-shadow:0 0 0 1px rgba(255,150,60,.25),0 18px 40px -24px rgba(255,120,40,.5)}
.incense-ritual.tier-3{border-color:rgba(255,150,60,.55);box-shadow:0 0 30px -6px rgba(255,140,50,.45);background:radial-gradient(120% 80% at 50% 100%,rgba(255,200,140,.25),transparent 60%)}
.incense-ritual.tier-4{border:2px solid transparent;box-shadow:0 0 40px -4px rgba(255,160,60,.6);
  background:radial-gradient(120% 80% at 50% 100%,rgba(255,210,140,.35),transparent 60%) padding-box,linear-gradient(var(--surface),var(--surface)) padding-box,

.count b{display:inline-block}

/* pouch chip + panel */
.ash-chip{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-family:var(--f-num);font-weight:600;font-size:14px}

@keyframes got{30%{transform:scale(1.25);color:var(--gold);background:rgba(255,236,190,.7)}}
.pouch-sub{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--water);margin:10px 6px 6px}
.luck-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 4px}
.luck-tile{display:grid;justify-items:center;gap:0;padding:8px 4px;border-radius:12px;background:#FFF6E2}
.luck-tile.down{background:#EEF1F8}
.luck-tile .lk{font-size:12px;color:var(--muted)}
.luck-tile b{font-family:var(--f-num);font-size:18px;color:#C2410C}

.luck-tile.zero{opacity:.55}
.theft-list{display:grid;gap:2px;margin:0 2px 6px}
.theft-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 6px;border-radius:10px;background:rgba(59,46,87,.07);font-size:12px}
.ash-lv{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.08em}
.ash-total{padding:6px 6px 2px;font-size:13px;color:var(--muted)}
.ash-total b{font-family:var(--f-num);font-size:30px;color:var(--ink);margin-right:4px}
.ash-bar{height:6px;border-radius:3px;background:var(--line);margin:6px 6px 0;overflow:hidden}
.ash-bar span{display:block;height:100%;background:linear-gradient(90deg,#C9C3BA,#E7B341)}
.ash-row{display:grid;gap:2px;padding:8px 6px;border-top:1px solid var(--line);font-size:13px}
/* deities */
.god-token{--gs:50px;width:var(--gs);height:var(--gs);border-radius:50%;display:inline-block;flex:none;position:relative;overflow:hidden}
.god-token svg{display:block;width:100%;height:100%}
.god-token.good{box-shadow:0 0 0 2px #F5C452,0 0 0 4px rgba(245,196,82,.35),0 6px 16px -4px rgba(200,30,20,.55)}
.god-token.bad{box-shadow:0 0 0 2px #6E8F6A,0 0 0 4px rgba(110,143,106,.35),0 6px 16px -4px rgba(40,20,70,.65)}
.god-fx{display:inline-block;margin-left:6px;font-style:normal;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#FDE7C8;color:#B4430F;white-space:nowrap}
.bad .god-fx{background:#E4DDF0;color:#4A3870}
.god-visit.bad .god-say .god-fx{background:#4A3870;color:#D7F5D0}
.god-quote{color:var(--ink)}
.god-card-body .god-fx{justify-self:start;margin-left:0;margin-top:2px}
.god-visit{position:absolute;right:-14px;top:6%;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:4px;animation:god-in .7s cubic-bezier(.3,1.4,.5,1) both}
.god-visit .god-token{animation:god-bob 2.4s ease-in-out infinite}
.god-visit::after{content:"";position:absolute;right:-6px;top:calc(var(--gs,50px) - 8px);width:64px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);pointer-events:none}
.god-visit.bad::after{background:radial-gradient(ellipse,rgba(120,100,150,.55),rgba(120,100,150,0) 70%)}
.god-say{max-width:170px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;line-height:1.4;padding:5px 10px;border-radius:12px;box-shadow:0 8px 18px -10px rgba(42,51,80,.45);text-align:left}
.god-visit.bad .god-say{background:#2E2440;color:#D7F5D0}
@keyframes god-in{from{opacity:0;transform:translateY(-30px) scale(.4)}}
@keyframes god-bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.sheet-god{right:auto;left:-8px;top:0;align-items:flex-start}

#god-toast{position:fixed;z-index:35;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(196px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px)}
.god-card{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px 14px;border-radius:20px;border:2px solid transparent;min-width:min(320px,100%);max-width:360px;

.god-card-tag{position:absolute;top:-11px;left:16px;font-size:11px;font-weight:700;letter-spacing:.14em;padding:2px 10px;border-radius:999px;background:#E2471E;color:#fff}

.god-card-body{display:grid;gap:2px;min-width:0;font-size:13px;color:var(--muted)}
.god-card-body b{font-size:15px;color:var(--ink)}
@keyframes card-flip{from{opacity:0;transform:perspective(600px) rotateY(80deg) translateY(20px)}}
.god-list{display:grid;gap:6px}
.toast-stack{display:grid;gap:8px;justify-items:end}
.slipper-btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#E2471E,#F59E0B);box-shadow:0 12px 24px -10px rgba(226,71,30,.7);cursor:pointer;animation:slip-pulse .8s ease-in-out infinite alternate}
.slipper-btn:disabled{animation:none;background:#3B2E57;color:#E6E3F0;box-shadow:none;font-weight:600;font-size:13px;cursor:default}
.slipper-e{font-size:22px;line-height:1;display:inline-block;animation:slip-wave .5s ease-in-out infinite alternate}
.slipper-cd{font-family:var(--f-num);min-width:1.6em;height:1.6em;display:inline-grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.25);font-size:13px}
@keyframes slip-pulse{to{transform:scale(1.06)}}
@keyframes slip-wave{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.slipper-fly{position:fixed;left:0;top:0;z-index:70;font-size:56px;line-height:1;pointer-events:none;animation:slip-fly .52s cubic-bezier(.4,0,.9,.5) both}
@keyframes slip-fly{from{transform:translate(var(--sx),var(--sy)) translate(-50%,-50%) rotate(0)}to{transform:translate(var(--tx),var(--ty)) translate(-50%,-50%) rotate(-720deg)}}
.god-card.whacked .god-token{animation:whacked .9s ease-in both}
@keyframes whacked{20%{transform:scale(.8) rotate(-15deg)}100%{transform:translateX(160px) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.slipper-btn,.slipper-e,.slipper-fly,.god-card.whacked .god-token{animation:none!important}}
.steal-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 12px}
.steal-list{display:grid;gap:8px}
.steal-item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 12px 8px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.steal-item:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px -16px rgba(42,51,80,.6)}

.steal-ph{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--bg)}
.steal-ph img{width:100%;height:100%;object-fit:cover}

.steal-go{font-size:12px;font-weight:700;color:#fff;background:#2E2440;padding:5px 12px;border-radius:999px;white-space:nowrap}

/* shop */
.shop-chip{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.shop-chip:hover{background:var(--bg)}

.pay-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pay-l{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--water);min-width:2.5em}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--water);border-color:var(--water);color:#fff}

.pay-note{margin:0;font-size:12px;color:var(--muted)}
.shop-sel{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.shop-item{display:grid;justify-items:center;gap:4px;padding:14px 8px 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.shop-item:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(42,51,80,.5)}
.shop-item:disabled{opacity:.55}
.shop-item b{font-size:14px}
.shop-e{font-size:34px;line-height:1.1}
.shop-e.sm{font-size:20px;text-align:center}
.shop-p{font-family:var(--f-num);font-size:12px;color:var(--ember);font-weight:600}
.decor-ring{position:absolute;inset:0;pointer-events:none;z-index:3}
.decor-e{position:absolute;left:50%;top:50%;font-size:calc(var(--s,190px)*.15);line-height:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--s,190px)*-.5)) rotate(calc(var(--a)*-1));filter:drop-shadow(0 3px 4px rgba(42,51,80,.3))}
.decor-e{animation:decor-bob 3s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes decor-bob{50%{margin-top:-4px}}
.decor-ring.golden::before{content:"";position:absolute;inset:-6%;border-radius:50%;box-shadow:0 0 0 3px rgba(245,196,82,.7),0 0 26px 6px rgba(245,196,82,.55);animation:breathe 3s ease-in-out infinite}
.decor-list{display:grid;gap:4px}
.decor-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--bg);font-size:13px}
.section-t .btn{font-size:12px}
/* the little dark room */
.jail-card .bubble .photo img{filter:grayscale(.75) brightness(.7) contrast(1.1)}
.jail-card .drop-name{color:#3B2E57}
.jail-dock{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;gap:4px;cursor:pointer;isolation:isolate}
.jail-dock::before{content:"";position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(16,12,28,.32),rgba(16,12,28,.16) 50%,rgba(16,12,28,0))}
.jail-house{width:132px;line-height:0;transition:transform .2s;filter:drop-shadow(0 6px 10px rgba(20,16,32,.35))}
.jail-house svg{display:block;width:100%;height:auto}
.jh-bulb{animation:jh-flicker 3.2s steps(1) infinite}
@keyframes jh-flicker{0%,100%{opacity:1}46%{opacity:.25}48%{opacity:1}50%{opacity:.3}52%{opacity:1}}
.jail-dock .drop-name{font-size:13px;letter-spacing:.24em;color:#EDE9F7;background:rgba(20,16,32,.85);padding:2px 12px;border-radius:999px}
.jail-dock .drop-meta{font-size:11px;color:#5E5870;gap:8px}
.jail-dock:hover .jail-house,.jail-dock:focus-visible .jail-house{transform:scale(1.08) rotate(-2deg)}
@media (max-width:520px){.jail-house{width:92px}.jail-dock::before{width:200px;height:200px;margin:-100px 0 0 -100px}#god-toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}}
.jail-bars{position:absolute;inset:10%;border-radius:50%;z-index:2;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 13%,rgba(30,28,40,.85) 13% 17%);-webkit-mask:radial-gradient(closest-side,#000 96%,transparent);mask:radial-gradient(closest-side,#000 96%,transparent)}
.jail-sheet{background:linear-gradient(180deg,#2B2838,#1E1C28);color:#E6E3F0;border-color:#3B3850}
.jail-sheet .section-t,.jail-sheet .jail-count b{color:#F3F0FA}
.jail-sheet .muted,.jail-sheet .section-t small,.jail-sheet .pay-note,.jail-sheet .pay-bal{color:#A39FB8}
.jail-sheet .pay-box{background:rgba(255,255,255,.06)}
.jail-sheet .chip{background:transparent;color:#E6E3F0;border-color:#4A4660}
.jail-sheet .chip.on{background:#E2471E;border-color:#E2471E}
.jail-sheet .pay-bal b{color:#fff}
.jail-sheet .god-row.bad{background:rgba(255,255,255,.05)}
.jail-sheet .x{color:#C9C5DA}
.jail-sheet .btn.ghost{color:#E6E3F0;border-color:#4A4660;background:transparent}
.jail-marks{z-index:1}
.jail-sheet.shake{animation:jail-shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes jail-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-16px) rotate(-1deg)}40%,60%{transform:translateX(16px) rotate(1deg)}}
.jail-count{margin:-6px 0 12px;color:#A39FB8}
.jail-count b{font-family:var(--f-num);font-size:20px}
.jail-cell{position:relative;width:min(320px,80vw);aspect-ratio:1;margin:0 auto 6px;border-radius:24px;overflow:hidden;background:#141219;box-shadow:inset 0 0 60px rgba(0,0,0,.8)}
.jail-photo{position:absolute;inset:0}
.jail-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.5) brightness(.85)}
.jail-photo>.muted{position:absolute;inset:0;display:grid;place-items:center}
.jail-bars.big{inset:0;border-radius:0;-webkit-mask:none;mask:none;background:repeating-linear-gradient(90deg,transparent 0 15%,rgba(25,24,32,.92) 15% 19.5%),linear-gradient(180deg,rgba(25,24,32,.92) 0 5%,transparent 5% 95%,rgba(25,24,32,.92) 95%)}
.jail-marks{position:absolute;inset:0;pointer-events:none}
.jmark{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot))}
.jmark.smoke{width:44px;height:34px;border-radius:50%;background:radial-gradient(closest-side,#2A1A10,#6B3A1E 55%,rgba(180,90,40,.5) 75%,transparent)}
.jmark.brick{width:62px;height:48px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,120,120,.85),rgba(230,60,70,.55) 60%,transparent)}
.jmark.brick::after{content:"";position:absolute;left:-6px;top:8px;width:42px;height:8px;border-radius:3px;background:#F4D9B8;box-shadow:inset 0 0 0 1px rgba(150,110,70,.4);transform:rotate(-20deg)}
.jail-say{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:86%;background:#fff;color:#2A3350;font-weight:700;font-size:14px;padding:6px 12px;border-radius:14px;text-align:center;animation:god-in .4s cubic-bezier(.3,1.4,.5,1) both;z-index:3}
.jail-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.jail-flash{position:fixed;inset:0;z-index:59;pointer-events:none;animation:jflash .45s ease-out both}

.jail-puff{position:fixed;z-index:61;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(closest-side,rgba(210,210,220,.9),rgba(210,210,220,0));pointer-events:none;animation:jpuff 1.8s ease-out both}

.jail-star{position:fixed;z-index:62;font-size:44px;line-height:1;pointer-events:none;transform:translate(-50%,-50%);animation:jstar 1.2s cubic-bezier(.2,.8,.3,1) both}

@media (prefers-reduced-motion:reduce){.decor-e,.decor-ring.golden::before,.jail-sheet.shake,.jail-prop{animation:none!important}}
/* tower spirits (incense thieves / moochers) */
.spirit{--ss:44px;width:var(--ss);height:var(--ss);display:inline-block;flex:none;position:relative}
.spirit svg{display:block;width:100%;height:100%;overflow:visible}
.spirit .mouth{transform-box:fill-box;transform-origin:center}
.raiders{position:absolute;inset:0;pointer-events:none;z-index:3}

function towerTotals(tid){

  for (const t of S.tallies) if (t.towerId===tid){ incense+=t.incense||0; merit+=t.merit||0; }
  const p = pending[tid]; if (p){ incense+=p.incense; merit+=p.merit; }
  incense += raidDelta(tid);
  for (const b of S.purchases) if (b.from === tid){ incense -= b.incense || 0; merit -= b.merit || 0; }

function canAct(){ return !!(S.db && S.uid && !S.readOnly); }
function bump(tid, kind, n=1){
  if (!canAct()) return;
  pending[tid] = pending[tid] || {incense:0, merit:0};
  pending[tid][kind] += n;
  clearTimeout(bump['t'+tid]);
  bump['t'+tid] = setTimeout(() => flush(tid), kind==='incense' ? 50 : 900);
}
async function flush(tid){
  if (inflight[tid]) return;
  const p = pending[tid]; if (!p || (!p.incense && !p.merit)) return;
  const add = {...p}; pending[tid] = {incense:0, merit:0};
  const cur = myTally(tid) || {};
  const body = { towerId:tid, by:S.uid,
    incense:(cur.incense||0)+add.incense, merit:(cur.merit||0)+add.merit,
    lastAt:Date.now(), lastIncenseAt: add.incense ? Date.now() : (cur.lastIncenseAt||0) };
  inflight[tid] = true;
  try { await S.db.doc('tallies/'+tid+'__'+S.uid).set(body); }
  catch(e){ handleWriteErr(e); pending[tid].incense += add.incense; pending[tid].merit += add.merit; }
  finally { inflight[tid] = false; const q = pending[tid]; if (q && (q.incense||q.merit)) setTimeout(()=>flush(tid), 300); }
}

  if (e && e.code === 'invalid_argument' && S.canWrite === null){ S.readOnly = true; render(); }

function knock(combo=1){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime, k = 1 + Math.min(combo,60)*.006;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(760*k,t); o.frequency.exponentialRampToValueAtTime(420*k,t+.09);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.55,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.18);
    const o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type='triangle'; o2.frequency.setValueAtTime(1500,t);
    g2.gain.setValueAtTime(.18,t); g2.gain.exponentialRampToValueAtTime(.0001,t+.04);
    o2.connect(g2).connect(actx.destination); o2.start(t); o2.stop(t+.05);
  }catch(e){}
}

function chime(big){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime, base = big ? 523.25 : 784;
    [[1,.32],[2.76,.12],[5.4,.06],[1.5,.1]].forEach(([m,v],i) => {
      const o = actx.createOscillator(), g = actx.createGain();

    });
  }catch(e){}
}

function loop(){

function ashFill(t){
  const list = towerSticks(t.id);
  if (list.length < CAP) return {stage:'need', need:CAP - list.length, fill:0, ready:false, left:ASH_MS};
  const fullSince = list[CAP-1].at || 0;
  const taken = towerAshTaken(t.id);
  const start = Math.max(fullSince, taken ? taken.at : 0), now = Date.now();
  // replay thefts by bad deities since this viewer's ash started piling up
  let acc = 0, tp = start, stolenBy = null;
  for (const e of godVisits(t.id)){
    const g = GODS[e.gid]; if (g.good || e.at <= start) continue;
    acc = Math.min(ASH_MS, acc + (e.at - tp)); acc *= (1 - g.steal); tp = e.at; stolenBy = e;
  }
  acc = Math.min(ASH_MS, acc + (now - tp));
  const fill = Math.max(0, Math.min(1, acc / ASH_MS));
  return {stage:'fill', fill, ready: fill >= 1, left: Math.max(0, ASH_MS - acc), stolenBy, taken};
}

/* ---------- tower spirits: stealing and mooching incense ----------

const RAID_RATE = 1/36e5, RAID_MAX = 3*36e5, RAID_WINDOW = 60*60e3, BEAT_P = .6;

function raidDelta(tid){

    if (r.tid === tid) d -= net;
    if (r.from === tid) d += net;
  }
  for (const k of S.tips){ if (k.demo) continue; if (k.tid === tid) d -= k.reward || 0; if (k.to === tid) d += k.reward || 0; }

function activeRaids(tid){ const now = Date.now(); return S.raids.filter(r => r.tid === tid && !raidDone(r, now)); }

function towerName(id){ const t = S.towers.find(x => x.id === id); return t ? t.name : '已拆除的塔位'; }
function burnerLeft(tid){

  let used = 0;
  for (const r of activeRaids(tid)){ used += raidEaten(r); for (const k of S.tips) if (k.raid === r.id) used += k.reward || 0; }

const OUTCOME = {beaten:'被揍了一頓，吐回一半', fled:'沒揍到，叼著香火跑了', released:'被放走了', full:'吃飽自己走了', recalled:'被主人叫回去了'};

let raiding = new Set();
async function maybeRaid(){
  if (!canAct() || S.towers.length < 2) return;
  const now = Date.now();
  for (const t of S.towers){
    const list = S.sticks.filter(s => s.towerId === t.id && s.at).sort((a,b) => a.at - b.at);
    const last = list[list.length - 1]; if (!last) continue;
    const r = rng('raid-' + last.id), due = last.at + (20 + r()*10) * 60e3;
    if (now < due || now > due + RAID_WINDOW) continue;
    const id = 'r_' + last.id;
    if (raiding.has(id) || S.raids.some(x => x.id === id)) continue;
    if (S.raids.some(x => x.tid === t.id && x.kind === 'thief' && (x.start >= last.at || !raidDone(x, now)))) continue;
    raiding.add(id);
    try {
      const ref = S.db.doc('raids/' + id);
      if ((await ref.get()).exists) continue;
      const pool = S.towers.filter(x => x.id !== t.id), claimed = pool.filter(x => x.claimedBy), from = (claimed.length ? claimed : pool);
      const pick = from[Math.floor(r() * from.length)];
      const cap = Math.min(CAP, towerSticks(t.id).length);
      if (!cap) continue;
      await ref.set({tid: t.id, from: pick.id, kind: 'thief', by: pick.claimedBy || null, start: Date.now(), cap, src: last.id});
    } catch(e){ /* another viewer may have sent the spirit already */ }
  }
}

  const eaten = raidEaten(r), now = Date.now();

      const f = h('span',{class:'fx-text ' + (hit ? 'incense' : 'ash'), text: hit ? '揍！' : '咻～跑了'}); f.style.left = (b.left + b.width/2) + 'px'; f.style.top = b.top + 'px'; f.style.setProperty('--rot','-6deg'); f.style.fontSize = '26px';

function sizzle(){
  try {

    const R = rng('pond'+key+round); placed = []; let ok = true;
    for (const it of items){
      const rad = (it.s + LABEL)/2; let spot = null;
      for (let k=0;k<500 && !spot;k++){
        const x = M + R()*(W - it.s - 2*M), y = R()*Math.max(1, H - it.s - LABEL);
        const cx = x + it.s/2, cy = y + (it.s+LABEL)/2;
        if (placed.every(p => Math.hypot(p.cx-cx, p.cy-cy) >= p.rad + rad + PAD - 14)) spot = {x,y,cx,cy,rad};
      }
      if (!spot){ ok = false; break; }
      placed.push({...spot, it});
    }
    if (ok) break; H *= 1.12;
  }
  let maxY = 0;
  for (const p of placed){
    const c = cards.get(p.it.t.id); if (!c) continue;
    c.style.left = p.x.toFixed(0)+'px'; c.style.top = p.y.toFixed(0)+'px'; c.style.width = p.it.s+'px';
    c._bubble.style.setProperty('--s', p.it.s+'px');

  }

}

function burnerSVG(shown, ash){

    const p = stickPos(i, shown.length, st);
    const isNew = st.id === lastInsert.id && performance.now() - lastInsert.at < 900;
    const delay = isNew ? -((performance.now() - lastInsert.at)/1000).toFixed(2) : 0;
    const handle = 20, paste = Math.max(4, p.len - handle);
    return `<g transform="rotate(${p.tilt.toFixed(1)} ${p.x.toFixed(1)} 97)"><g data-id="${st.id}" class="${isNew?'stick-new':''}" style="${isNew?`animation-delay:${delay}s`:''}">
      <rect x="${(p.x-1.6).toFixed(1)}" y="${(97-handle).toFixed(1)}" width="3.2" height="${handle+6}" rx="1" fill="#C0392B"/>

    ${sticks}
    <path d="M${36-fill*4} 97.5 Q85 ${(peak*2-97).toFixed(1)} ${134+fill*4} 97.5 Q85 103 ${36-fill*4} 97.5 Z" fill="url(#ashG)" opacity="${(0.35 + fill*.65).toFixed(2)}"/>
    ${ready ? `<circle class="ash-glint" cx="70" cy="${(peak+2).toFixed(1)}" r="1.6" fill="#fff"/><circle class="ash-glint" cx="98" cy="${(peak+3).toFixed(1)}" r="1.3" fill="#fff" style="animation-delay:.7s"/>` : ''}
    <path d="M27 96 Q30 136 85 138 Q140 136 143 96 Q85 108 27 96 Z" fill="url(#bowlG)"/>

function shrink(file){
  return new Promise((res,rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const S2 = 420, c = document.createElement('canvas'); c.width=c.height=S2;
      const k = Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S2,S2);
      URL.revokeObjectURL(url);
      let q=.82, out=c.toDataURL('image/jpeg',q);
      while (out.length>120000 && q>.4){ q-=.1; out=c.toDataURL('image/jpeg',q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); };
    img.src = url;
  });
}
function openCreate(){
  if (!canAct()) return;

  });
  const name = h('input',{type:'text',id:'f-name',maxlength:'20',placeholder:'例如：阿明',required:true});

    if (!name.value.trim()){ err.textContent='請填寫塔主名號。'; return; }
    submit.disabled = true; submit.textContent='開塔中…';
    const id = 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

      await S.db.doc('towers/'+id).set({name:name.value.trim().slice(0,20), epitaph:epi.value.trim().slice(0,60),

    } catch(e2){ handleWriteErr(e2); submit.disabled=false; submit.textContent='開塔入住'; }
  }},

    h('p',{class:'muted',style:'margin:-4px 0 18px'},'替朋友（或您自己）安一個位置。開好之後，請把連結傳給本人來認領。'), form));
  setTimeout(()=>file.focus(),50);
}

render();
(async () => {
  if (!window.claude || !window.claude.use){ S.offline = true; S.ready = true; render(); return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  S.user = user;
  if (!db){ S.offline = true; S.ready = true; render(); return; }
  S.db = db;
  if (user){
    try { S.uid = await user.id(); } catch(e){}
    try { S.canWrite = await user.can('data.write'); } catch(e){}
    try { S.isOwner = await user.isOwner(); } catch(e){}
    if (S.canWrite === false) S.readOnly = true;
  }
  let got = 0; const loaded = () => { if (++got >= 1 && !S.ready){ S.ready = true; const id = location.hash.slice(1); if (id && S.towers.some(t=>t.id===id)) openTower(id); } };
  const onErr = e => { if (e && e.code === 'revoked'){ S.offline = true; render(); } };
  db.collection('towers').orderBy('createdAt','asc').limit(500).onSnapshot(snap => {
    S.towers = snap.docs.map(d => ({id:d.id, ...d.data()}));
    loaded(); render();
  }, onErr);
  db.collection('sticks').orderBy('at','desc').limit(1000).onSnapshot(snap => {
    S.sticks = snap.docs.map(d => ({id:d.id, ...d.data()}));
    const ids = new Set(S.sticks.map(x=>x.id)); S.localSticks = S.localSticks.filter(x => !ids.has(x.id));
    render();
  }, onErr);
  setInterval(() => { if (S.sheet === 'tower') softSheet(); else if (S.sheet === 'jail' && !jailBusy) renderJail(false); }, 20000); // sticks burn down, ash accumulates
  db.collection('gods').orderBy('at','desc').limit(500).onSnapshot(snap => {
    S.gods = snap.docs.map(d => ({id:d.id, ...d.data()}));
    godTick();
  }, onErr);
  setInterval(() => { maybeSummon(); godTick(); }, 5000); setTimeout(maybeSummon, 2500);
  db.collection('raids').orderBy('start','desc').limit(500).onSnapshot(snap => {
    const demos = S.raids.filter(r => r.demo);
    S.raids = [...snap.docs.map(d => ({id:d.id, ...d.data()})).filter(r => r.start), ...demos];
    raidTick(); render();
  }, onErr);
  db.collection('tips').orderBy('at','desc').limit(500).onSnapshot(snap => {
    const demos = S.tips.filter(k => k.demo);
    S.tips = [...snap.docs.map(d => ({id:d.id, ...d.data()})), ...demos]; render();
  }, onErr);
  setInterval(maybeRaid, 15000); setTimeout(maybeRaid, 4000);
  db.collection('purchases').orderBy('at','desc').limit(3000).onSnapshot(snap => {
    const ids = new Set(snap.docs.map(d => d.id));
    S.purchases = [...snap.docs.map(d => ({id:d.id, ...d.data()})), ...S.purchases.filter(b => !ids.has(b.id) && Date.now() - b.at < 15e3)]; render();
  }, onErr);
  db.collection('ashlog').limit(500).onSnapshot(snap => { S.ashlog = snap.docs.map(d => ({id:d.id, ...d.data()})); if (S.sheet === 'tower') softSheet(); }, onErr);
  db.doc('site/jail').onSnapshot(d => { S.jail = d.exists ? d.data() : null; render(); }, onErr);
  db.collection('tallies').limit(1000).onSnapshot(snap => {
    S.tallies = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
  }, onErr);
  db.doc('site/marquee').onSnapshot(d => { S.marquee = d.exists ? d.data() : null; renderMarquee(); }, onErr);
  if (S.uid){
    try { S.lastSeen = Number(localStorage.getItem('cyt-seen-'+S.uid)) || 0; } catch(e){}
    db.doc('data/users/'+S.uid+'/luck').onSnapshot(d => {
      if (luckDirty) return;
      const v = d.exists ? d.data() : null;
      if (v) S.luck = {s: v.s || {}, check: v.check || Date.now(), log: Array.isArray(v.log) ? v.log : []};
      const first = !luckLoaded; luckLoaded = true;
      renderAsh(); if (first) setTimeout(processThefts, 2500);
    }, () => {});
    db.doc('data/users/'+S.uid+'/ash').onSnapshot(d => {
      if (ashBusy) return;
      const v = d.exists ? d.data() : null;
      S.ash = {total:(v&&v.total)||0, last:(v&&v.last)||{}, log:(v&&Array.isArray(v.log))?v.log:[]};
      renderAsh(); if (S.sheet === 'tower') renderTowerSheet(false);
    }, () => {});
    db.doc('data/users/'+S.uid+'/prefs').onSnapshot(d => { const v = d.exists ? (d.data().lastSeen||0) : 0; if (v > S.lastSeen) S.lastSeen = v; renderBanner(); }, () => {});
  }
  db.collection('notes').orderBy('at','desc').limit(500).onSnapshot(snap => {
    S.notes = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
  }, onErr);
  db.collection('messages').orderBy('at','asc').limit(1000).onSnapshot(snap => {
    S.messages = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
  }, onErr);
  setInterval(()=>{ renderGrid(); }, 60000); // lets notes drop off the home page when their 24 hours end
})();
